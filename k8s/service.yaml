apiVersion: v1
kind: Service
metadata:
  name: apt-api-gateway-service
  namespace: zero-trust-secops
  labels:
    app.kubernetes.io/name: apt-api-gateway
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: apt-api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: ray-head-service
  namespace: zero-trust-secops
  labels:
    app.kubernetes.io/name: ray-head
spec:
  type: ClusterIP
  ports:
    - port: 8265
      targetPort: 8265
      name: dashboard
    - port: 10001
      targetPort: 10001
      name: client
    - port: 6379
      targetPort: 6379
      name: gcs
  selector:
    app: ray-head
---
apiVersion: v1
kind: Service
metadata:
  name: falkordb-service
  namespace: zero-trust-secops
  labels:
    app.kubernetes.io/name: falkordb
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis-graph
  selector:
    app: falkordb
