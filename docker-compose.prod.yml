version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. FalkorDB High-Performance In-RAM Graph Database
  # ---------------------------------------------------------------------------
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb_cluster_prod
    restart: always
    ports:
      - "6379:6379"
    environment:
      - FALKORDB_ARGS=--save 60 1000 --maxmemory 8gb --maxmemory-policy noeviction
    volumes:
      - falkordb_data:/data
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apt_hunting_net

  # ---------------------------------------------------------------------------
  # 2. Apache Kafka & Zookeeper Telemetry Pub/Sub Backbone
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper_prod
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - apt_hunting_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_telemetry_prod
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - apt_hunting_net

  # ---------------------------------------------------------------------------
  # 3. High-Throughput Stream Ingestion Worker (The Data Plane)
  # ---------------------------------------------------------------------------
  stream-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream_processor_prod
    command: python -u stream_processor.py
    restart: always
    depends_on:
      falkordb:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    networks:
      - apt_hunting_net

  # ---------------------------------------------------------------------------
  # 4. Ray RLlib Distributed Control Plane (Head Node)
  # ---------------------------------------------------------------------------
  ray-head:
    image: rayproject/ray:2.9.0-py310
    container_name: ray_head_prod
    ports:
      - "8265:8265"  # Ray Web Dashboard
      - "10001:10001" # Ray Client Server
    command: >
      bash -c "ray start --head --port=6379 --dashboard-host=0.0.0.0 --num-cpus=2 --block"
    shm_size: 4gb
    volumes:
      - ray_buffer_ssd:/tmp/ray
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    networks:
      - apt_hunting_net

  # ---------------------------------------------------------------------------
  # 5. Ray Distributed Rollout Workers
  # ---------------------------------------------------------------------------
  ray-worker:
    image: rayproject/ray:2.9.0-py310
    depends_on:
      - ray-head
    command: >
      bash -c "ray start --address=ray-head:6379 --num-cpus=4 --block"
    shm_size: 4gb
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    networks:
      - apt_hunting_net

  # ---------------------------------------------------------------------------
  # 6. FastAPI ASGI Explainability Gateway (The Serving Layer)
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_gateway_prod
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - RAY_ADDRESS=ray-head:10001
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    networks:
      - apt_hunting_net

  # ---------------------------------------------------------------------------
  # 7. Go SOAR & Chronicle Integration Engine (The Orchestration Plane)
  # ---------------------------------------------------------------------------
  soar-connector:
    image: golang:1.21-alpine
    container_name: soar_connector_prod
    working_dir: /app
    volumes:
      - ./soar_connector.go:/app/soar_connector.go
    command: go run soar_connector.go
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DRY_RUN=true
      - CHRONICLE_API_URL=https://malapi2.googleapis.com/v1/udm:events
      - XSOAR_WEBHOOK_URL=https://xsoar.secops.internal/incident/upload
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - apt_hunting_net

# =============================================================================
# Networks & Persistent SSD Storage Volumes
# =============================================================================
networks:
  apt_hunting_net:
    driver: bridge

volumes:
  falkordb_data:
    driver: local
  kafka_data:
    driver: local
  ray_buffer_ssd:
    driver: local
